spring:
  application:
    name: mall-monitor
  profiles:
    active: dev
  cloud:
    inetutils:
      preferred-networks:
        - 192.168.1
  security: # 配置登录用户名和密码
    user:
      name: macro
      password: 123456
  boot:  # 不显示admin-server的监控信息
    admin:
      discovery:
        ignored-services: ${spring.application.name}
server:
  port: 8101
