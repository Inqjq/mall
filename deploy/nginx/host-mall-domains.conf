# mall-swarm 三端域名接入（宿主 nginx 增量 vhost，不影响 xqkaifa.art/www 主站）
# 部署位置：/etc/nginx/conf.d/mall-domains.conf
# Phase 2：80 保留 ACME 目录并 301 → https；443 挂载腾讯云免费 DV 证书（90 天，到期前重新申请替换）
# 证书文件：/etc/nginx/ssl/{shop,admin,merchant}.xqkaifa.art_bundle.crt / .key

# --- 商城 H5: shop.xqkaifa.art -> 127.0.0.1:8088 ---
server {
    listen 80;
    server_name shop.xqkaifa.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name shop.xqkaifa.art;

    ssl_certificate     /etc/nginx/ssl/shop.xqkaifa.art_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/shop.xqkaifa.art.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 页面内所有请求不携带 Referer：macro-oss OSS 开启防盗链，带 Referer 一律 403（浏览器按 ORB 拦截）
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }
}

